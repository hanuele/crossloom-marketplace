# CI for the CrossLoom Claude Code plugin marketplace (#285).
#
# This repo had NO CI until now. That was tolerable while it shipped only Skills
# and config; it stopped being tolerable once it started shipping the ObjectType
# knowledge corpus, because that corpus is a MIRROR of the crossloom-cli wheel and
# a mirror with no guard rots by construction. "Remember to re-run the sync before
# releasing" is a human-memory dependency, and human memory is the thing this whole
# plan exists to route around.
#
# Everything here runs WITHOUT access to the private crossloom-cli repo — the
# mirror is verified against the manifest that ships beside it. The other half of
# the guard (mirror vs the wheel's authored sheets) lives in crossloom-cli's own
# test suite, which has both trees on disk.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The knowledge mirror: every sheet matches its manifest hash, every sheet
      # is routed by the dispatcher, no unmanifested file was hand-added.
      - name: Verify the vendored knowledge mirror
        run: python scripts/verify_knowledge_mirror.py

      # The plugin's own JSON must parse. A malformed marketplace.json or
      # plugin.json does not fail loudly at install time — it fails as a plugin
      # that silently never loads, which is the worst failure shape available to
      # an auto-updating distribution channel.
      - name: Validate plugin JSON
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          failed = False
          for rel in [".claude-plugin/marketplace.json",
                      "plugins/crossloom/.claude-plugin/plugin.json",
                      "plugins/crossloom/.mcp.json",
                      "plugins/crossloom/compat.json"]:
              p = Path(rel)
              if not p.is_file():
                  print(f"FAIL: {rel} is missing", file=sys.stderr)
                  failed = True
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except json.JSONDecodeError as e:
                  print(f"FAIL: {rel} is not valid JSON: {e}", file=sys.stderr)
                  failed = True
              else:
                  print(f"OK: {rel}")
          sys.exit(1 if failed else 0)
          PY

      # The MCP launcher is ONE extensionless command name backed by TWO files (#900531,
      # nao's extensionless-command-resolves-per-platform pattern): .mcp.json names
      # ${CLAUDE_PLUGIN_ROOT}/bin/cl-mcp; Windows resolves that through PATHEXT to
      # bin/cl-mcp.cmd, a Unix kernel execs bin/cl-mcp via its shebang.
      #   cl-mcp.cmd: LF-only (sh is not involved, but cmd.exe mis-seeks labels in LF
      #     files, so it uses no goto), NO shebang (a #! line is exactly what made 0.5.0
      #     print two non-JSON stdout lines before the first JSON-RPC message).
      #   cl-mcp: line 1 exactly #!/bin/sh (posix_spawn has no ENOEXEC fallback), CR-free,
      #     sh -n clean, index mode 100755.
      # A broken launcher does not fail loudly — it fails as a plugin whose MCP server
      # silently never starts on one platform.
      - name: MCP launcher pair (cl-mcp + cl-mcp.cmd) is well-formed and referenced
        run: |
          python - <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path

          bindir = Path("plugins/crossloom/bin")
          sh_launcher, cmd_launcher = bindir / "cl-mcp", bindir / "cl-mcp.cmd"
          failed = False

          def fail(msg):
              global failed
              print(f"FAIL: {msg}", file=sys.stderr)
              failed = True

          def index_mode(path):
              out = subprocess.run(["git", "ls-files", "-s", str(path)],
                                   capture_output=True, text=True).stdout.split()
              return out[0] if out else None

          for f in (sh_launcher, cmd_launcher):
              if not f.is_file():
                  fail(f"{f} is missing")
          if failed:
              print("FAILED launcher checks"); sys.exit(1)

          # --- cl-mcp.cmd: the Windows half ---
          cb = cmd_launcher.read_bytes()
          if b"\r" in cb:
              fail(f"{cmd_launcher} contains CR bytes (must be LF-only)")
          if cb.startswith(b"#!"):
              fail(f"{cmd_launcher} starts with a shebang; cmd.exe would echo it to stdout "
                   "ahead of the first JSON-RPC message (the 0.5.0 preamble)")
          if cb.split(b"\n", 1)[0].strip().lower() != b"@echo off":
              fail(f"{cmd_launcher} line 1 must be '@echo off'")
          code = [ln for ln in cb.decode("utf-8").splitlines()
                  if not ln.lstrip().lower().startswith(("rem", "::"))]
          if any(re.search(r"\bgoto\b", ln, re.I) for ln in code):
              fail(f"{cmd_launcher} uses goto (labels mis-seek in LF-only batch files)")

          # --- cl-mcp: the macOS/Linux half ---
          sb = sh_launcher.read_bytes()
          if b"\r" in sb:
              fail(f"{sh_launcher} contains CR bytes (sh rejects CR)")
          if sb.split(b"\n", 1)[0] != b"#!/bin/sh":
              fail(f"{sh_launcher} line 1 must be exactly '#!/bin/sh' (posix_spawn has "
                   "no ENOEXEC fallback)")
          sh = subprocess.run(["sh", "-n", str(sh_launcher)], capture_output=True, text=True)
          if sh.returncode != 0:
              fail(f"sh -n {sh_launcher}: {sh.stderr.strip()}")
          if index_mode(sh_launcher) != "100755":
              fail(f"{sh_launcher} index mode is {index_mode(sh_launcher)}, expected 100755")

          # --- .mcp.json names the extensionless pair ---
          mcp = json.loads(Path("plugins/crossloom/.mcp.json").read_text(encoding="utf-8"))
          cmd = mcp["mcpServers"]["crossloom"]["command"]
          # EXPECTED is built by concatenation: a literal dollar-double-brace would be
          # evaluated by GitHub Actions as an expression before Python ever sees it.
          EXPECTED = "$" + "{CLAUDE_PLUGIN_ROOT}/bin/cl-mcp"
          if cmd != EXPECTED:
              fail(f".mcp.json command is {cmd!r}, expected " + repr(EXPECTED) + " "
                   "(extensionless: PATHEXT picks cl-mcp.cmd on Windows, the kernel execs "
                   "cl-mcp elsewhere)")
          target = Path("plugins/crossloom") / cmd.replace("${CLAUDE_PLUGIN_ROOT}/", "")
          if not target.is_file() or not target.with_name(target.name + ".cmd").is_file():
              fail(f".mcp.json command {cmd!r} does not resolve to bin/cl-mcp with "
                   "bin/cl-mcp.cmd beside it")
          if mcp["mcpServers"]["crossloom"].get("args", []) != []:
              fail(".mcp.json args must be []")

          print("OK" if not failed else "FAILED", "launcher checks")
          sys.exit(1 if failed else 0)
          PY

      # The marketplace's declared plugin version and the plugin's own manifest
      # must agree. They are two files a human edits by hand at release time, and
      # a mismatch means auto-update either never fires or fires on a lie.
      - name: Plugin version agrees with the marketplace entry
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          market = json.loads(
              Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          plugin = json.loads(
              Path("plugins/crossloom/.claude-plugin/plugin.json").read_text(
                  encoding="utf-8"))
          entries = [p for p in market.get("plugins", []) if p.get("name") == "crossloom"]
          if not entries:
              print("FAIL: no 'crossloom' entry in marketplace.json", file=sys.stderr)
              sys.exit(1)
          declared, actual = entries[0].get("version"), plugin.get("version")
          if declared != actual:
              print(
                  f"FAIL: marketplace.json says version {declared!r} but "
                  f"plugin.json says {actual!r} — auto-update keys off the "
                  "marketplace entry, so a stale one means the fix never ships.",
                  file=sys.stderr)
              sys.exit(1)
          print(f"OK: plugin version {actual} agrees across both manifests")
          PY
